<!doctype html>
<html lang="en">
  <head>

    <meta name="description" content="evanwolo's coding portfolio.">
    <title>evanwolo — Portfolio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #222;
        background: #fff;
      }

      * { box-sizing: border-box; }

      body {
        max-width: 640px;
        margin: 0 auto;
        padding: 80px 24px;
        font-size: 16px;
        line-height: 1.6;
      }

      h1 {
        margin: 0 0 40px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
      }

      section + section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #e5e5e5;
      }

      p { margin: 0; }

      a {
        color: inherit;
        text-underline-offset: 4px;
      }

      a:hover { text-decoration-thickness: 2px; }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
      }

      .social-links {
        display: flex;
        gap: 12px;
      }

      .social-links a {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid #222;
        border-radius: 50%;
        text-decoration: none;
      }

      .social-links a:hover {
        color: #fff;
        background: #222;
      }

      .social-links svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }

      @media (max-width: 480px) {
        body { padding-top: 40px; }
      }
    </style>
  </head>
