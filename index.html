<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Projects by evanwolo: parish data tools and a fantasy baseball dashboard.">
    <title>evanwolo — Portfolio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #222;
        background: #fff;
      }

      * { box-sizing: border-box; }

      body {
        max-width: 640px;
        margin: 0 auto;
        padding: 80px 24px;
        font-size: 16px;
        line-height: 1.6;
      }

      h1 {
        margin: 0 0 40px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
      }

      section + section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #e5e5e5;
      }

      p { margin: 0; }

      .intro { margin: -28px 0 40px; color: #666; }

      .index-heading {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        color: #666;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .index-heading span { font-variant-numeric: tabular-nums; }
      .project { border-top: 1px solid #e5e5e5; }
      .project:last-child { border-bottom: 1px solid #e5e5e5; }
      .project summary {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto 16px;
        align-items: center;
        gap: 12px;
        padding: 22px 0;
        cursor: pointer;
        list-style: none;
      }
      summary::-webkit-details-marker { display: none; }
      .number, .category, .indicator { color: #777; font-size: 12px; }
      .technologies { display: flex; flex-wrap: wrap; justify-content: flex-end; max-width: 164px; align-items: center; gap: 10px; color: #666; }
      .technologies img { display: block; width: 19px; height: 19px; flex: 0 0 auto; }
      .number { font-variant-numeric: tabular-nums; }
      .project-title { font-size: 16px; font-weight: 500; }
      .project-heading { min-width: 0; }
      .project-title { display: block; }
      .project-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
      .project-tag {
        padding: 2px 7px;
        border: 1px solid #e5e5e5;
        border-radius: 3px;
        color: #666;
        font-size: 10px;
        font-weight: 400;
        line-height: 1.5;
      }
      .indicator { text-align: right; transition: transform 180ms ease; }
      .project[open] .indicator { transform: rotate(45deg); }
      summary:hover .project-title { text-decoration: underline; text-underline-offset: 4px; }
      summary:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
      .project-body { padding: 0 0 26px 40px; }
      .project-body p { color: #555; }
      .project-body .project-overview { margin-top: 18px; font-size: 14px; }
      .project-full-title { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
      .project-body .project-context { margin: 12px 0; color: #666; font-size: 12px; }
      .project-metrics { display: flex; flex-wrap: wrap; gap: 16px 24px; margin: 24px 0 12px; }
      .project-metrics div { display: flex; flex-direction: column-reverse; }
      .project-metrics dt { font-size: 11px; color: #666; }
      .project-metrics dd { margin: 0; font-size: 23px; letter-spacing: -0.7px; font-variant-numeric: tabular-nums; }
      .project-body .results-note { color: #777; font-size: 11px; }

      .project-body ul { margin: 16px 0 0; padding-left: 18px; color: #555; font-size: 14px; }
      .project-body li + li { margin-top: 6px; }
      .repository-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 22px;
        padding: 7px 11px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 12px;
        text-decoration: none;
      }
      .repository-link:hover { background: #f5f5f5; border-color: #999; }
      .repository-link svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
      .repository-arrow { color: #777; }
      .project-visual { margin: 22px 0 0; }
      .project-visual img { display: block; width: 100%; height: auto; max-height: 150px; }
      .project-visual figcaption { margin-top: 8px; font-size: 11px; color: #777; }
      @media (prefers-reduced-motion: reduce) { .indicator { transition: none; } }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }

      a:hover { text-decoration-thickness: 2px; }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
      }

      .social-links {
        display: flex;
        gap: 12px;
      }

      .social-links a {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid #222;
        border-radius: 50%;
        text-decoration: none;
      }

      .social-links a:hover {
        color: #fff;
        background: #222;
      }

      .social-links svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }

      @media (max-width: 480px) {
        body { padding-top: 40px; }
        .project summary { gap: 8px; grid-template-columns: 22px minmax(0, 1fr) auto 12px; }
        .project-body { padding-left: 30px; }
        .technologies { gap: 6px; max-width: 60px; }
        .technologies img { width: 16px; height: 16px; }
        .project-title { font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Evan Wologodzew</h1>
      <p class="intro">A few things I&rsquo;ve built.</p>

      <section aria-labelledby="projects-heading">
        <h2 id="projects-heading" class="index-heading">Projects <span id="project-count"></span></h2>
        <p id="project-status" role="status">Loading projects&hellip;</p>
        <div id="project-list"></div>
        <noscript>Enable JavaScript to view the project showcase.</noscript>
      </section>

      <section aria-label="Contact">
        <nav class="social-links" aria-label="Contact links">

          </a>
        </nav>
      </section>
    </main>
    <script src="projects.js" defer></script>
  </body>
</html>
